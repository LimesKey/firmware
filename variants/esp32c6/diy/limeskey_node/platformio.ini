; limeskey-node — custom ESP32-C6 Meshtastic node
; Seeed XIAO ESP32-C6 + EBYTE E22P-915M30S (SX1262) LoRa + u-blox NEO-M9N (SPI, unused by firmware)
[env:limeskey_node]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_level = extra

build_flags =
  ${esp32c6_base.build_flags}
  ; PRIVATE_HW and _VARIANT_LIMESKEY_NODE are defined in variant.h (avoids -D/header redefinition)
  -D LIMESKEY_NODE
  -I variants/esp32c6/diy/limeskey_node
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; Route 2.4 GHz (Wi-Fi/BLE) to the XIAO C6 external U.FL antenna. Leave commented
  ; unless a U.FL antenna is actually fitted — switching to an open U.FL port hurts
  ; 2.4 GHz performance. See earlyInitVariant() in the variant.cpp for the pins.
  -DXIAO_EXTERNAL_24_ANTENNA=1
  ; EBYTE E22(P)-900M30S PA family: TX_GAIN_LORA=7, SX126X_MAX_POWER=22 dBm (~30 dBm out).
  ; The E22P-915M30S is the 915 MHz member of the same 30 dBm / 10 dB-PA family;
  ; the operating frequency is chosen at runtime via the Meshtastic region config.
  -D EBYTE_E22_900M30S
  ; ESP32-C6 with 4 MB flash is tight on space — drop screen + audio (same as tlora_c6).
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  ; Headless GPS+LoRa node: drop modules that need hardware this board doesn't have
  ; or features it doesn't use. Kept: BLE, WiFi, MQTT, PKI, GPS, I2C telemetry
  ; (GPIO22/23 broken out for a future sensor). Remove a line to re-enable a module.
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1      ; needs a screen + input device (neither present)
  -DMESHTASTIC_EXCLUDE_INPUTBROKER=1         ; no buttons/keyboard/rotary on this board
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1 ; no buzzer/notification LED wired
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1     ; no detection-sensor GPIO in use
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1        ; needs PSRAM; the C6 has none (Total PSRAM: 0)
  -DMESHTASTIC_EXCLUDE_RANGETEST=1           ; bench/test-only feature
  -DMESHTASTIC_EXCLUDE_ATAK=1                ; ATAK plugin bridge, unused
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1      ; remote GPIO control, unused
  -DMESHTASTIC_EXCLUDE_DROPZONE=1            ; niche skydiving module, unused

lib_ignore =
  ${esp32c6_base.lib_ignore}
  ESP32 Codec2

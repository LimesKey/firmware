; limeskey-node — custom ESP32-C6 Meshtastic node
; Seeed XIAO ESP32-C6 + EBYTE E22P-915M30S (SX1262) LoRa + u-blox NEO-M9N (SPI, unused by firmware)
[env:limeskey_node]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_level = extra

build_flags =
  ${esp32c6_base.build_flags}
  ; PRIVATE_HW and _VARIANT_LIMESKEY_NODE are defined in variant.h (avoids -D/header redefinition)
  -D LIMESKEY_NODE
  -I variants/esp32c6/diy/limeskey_node
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; EBYTE E22(P)-900M30S PA family: TX_GAIN_LORA=7, SX126X_MAX_POWER=22 dBm (~30 dBm out).
  ; The E22P-915M30S is the 915 MHz member of the same 30 dBm / 10 dB-PA family;
  ; the operating frequency is chosen at runtime via the Meshtastic region config.
  -D EBYTE_E22_900M30S
  ; ESP32-C6 with 4 MB flash is tight on space — drop screen + audio (same as tlora_c6).
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1

lib_ignore =
  ${esp32c6_base.lib_ignore}
  ESP32 Codec2
